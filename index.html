  <title>TypoStudio</title>
  <style>
    @font-face {
      font-family: 'Press Start 2P';
      src: url('./fonts/press-start-2p/PressStart2P-Regular.woff2') format('woff2');
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: Jua;
      src: url('./fonts/jua/Jua-Regular.woff2') format('woff2');
      font-weight: 400;
    }


    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      padding: 40px 0 0;
      background: #e8e8e8;
      font-family: 'Press Start 2P', monospace;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: min(1100px, calc(100vw - 40px));
      margin-bottom: 20px;
    }

    h3 {
      font-weight: 400;
      color: #333;
      margin: 0;
    }

    .coffee-link {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      color: #333;
      font-family: inherit;
      font-size: 0.65rem;
      line-height: 1.8;
      text-decoration: none;
    }

    .coffee-link:hover,
    .coffee-link:focus-visible {
      text-decoration: underline;
      text-underline-offset: 0.3em;
    }

    canvas {
      display: block;
    }

    .loading-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 300px;
      height: 400px;
      transform-origin: top left;
      display: grid;
      place-items: center;
      background: #fffefd;
      border: 18px solid #f0f0f0;
      box-shadow: 0 6px 30px rgba(0, 0, 0, .18);
      pointer-events: none;
    }
    .loading-frame[hidden] { display: none; }
    .loading-frame::before {
      content: '';
      width: 24px;
      height: 24px;
      border: 3px solid #dedede;
      border-top-color: #65676a;
      border-radius: 50%;
      animation: loading-spin .8s linear infinite;
    }
    @keyframes loading-spin { to { transform: rotate(1turn); } }
    @media (prefers-reduced-motion: reduce) {
      .loading-frame::before { animation: none; }
    }

    footer {
      text-align: center;
      margin-top: 50px;
      padding-bottom: 20px;
      color: #888;
      font-size: 0.9em;
    }

    .theme-toggle {
      margin-top: 16px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 0.9em;
      cursor: pointer;
    }

    /* 8비트 LCD 픽셀 테마 (하단 버튼으로 body.pixel-theme 토글) — 액자(canvas)는 영향 없음 */
    :root {
      --lcd-bg: #c9c9c9;        /* 하단 하드웨어 배경 패널 색상 (회색) */
      --pixel-color: #65676a;   /* 픽셀 소자 자체의 색상 */
      --pixel-size: 4px;        /* 물리적 도트 최소 단위 */
    }

    body.pixel-theme {
      background-color: var(--lcd-bg);
      background-image:
        linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    body.pixel-theme h3,
    body.pixel-theme .coffee-link,
    body.pixel-theme footer,
    body.pixel-theme .theme-toggle {
      font-family: 'Press Start 2P', monospace;
      color: var(--pixel-color);
      image-rendering: pixelated;
      /* 픽셀 도트가 배경에 드리우는 그림자 */
      text-shadow: 3px 3px 3px rgba(83, 83, 83, 0.25);
    }

    body.pixel-theme h3 {
      font-size: 1.4rem;
    }

    body.pixel-theme footer {
      font-size: 0.6rem;
      line-height: 1.8;
    }

    body.pixel-theme .theme-toggle {
      background: var(--lcd-bg);
      border: var(--pixel-size) solid var(--pixel-color);
      padding: 12px 18px;
      box-shadow: 4px 4px 1px rgba(92, 67, 8, 0.35);
    }

    body.pixel-theme .theme-toggle:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 1px rgba(92, 67, 8, 0.35);
    }

    /* Responsive styles */
    @media (max-width: 1100px) {
      body {
        padding-top: 80px;
      }

      .frame-container {
        margin: 0 auto !important;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      footer {
        margin-top: 20px;
        padding-bottom: 20px;
      }
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
    }
  </style>
</head>

      {

      {
        text: "RESUME", link: "https://typ0s2d10-resume.typ0s2d10.workers.dev/", repo: null,
        palette: ["#294861", "#476e86", "#748a98"],
        en: {
          keywords: ["Build", "Code"], terms: ["design", "team", "tools", "work"],
          passage: "Open the developer resume. Explore the work behind web and mobile software, from writing code and designing systems to keeping services running."
        },
        ko: {
          title: "이력서", keywords: ["개발", "경력"], terms: ["설계", "운영", "코드", "기술"],
          passage: "개발자의 경력서를 엽니다. 웹과 모바일 소프트웨어의 설계부터 코드 작성, 서비스 운영까지 이어지는 개발 경험을 살펴보십시오."
        }
      },
    ]
    const frameByText = Object.fromEntries(framesData.map(f => [f.text, f]))
    // GA 이벤트/식별용 라벨: 줄바꿈 제거한 순수 이름
    const frameLabel = t => t.replace(/\n/g, "")


    // --- Main Setup and Drawing Function ---
    const loadingFrame = document.getElementById('loading-frame')
    const revealMs = 320
    let loadingStartedAt = 0
    let frameSlots = []

    function positionLoadingFrame()
    {
      const slot = frameSlots[frames.length]
      loadingFrame.hidden = !slot || frames.length > 0
      canvas.setAttribute('aria-busy', String(Boolean(slot)))
      if (!loadingFrame.hidden) {
        const scale = canvasSize.scale
        loadingFrame.style.transform = `translate(${slot.x * scale}px, ${slot.y * scale}px) scale(${scale})`
        if (loadingFrame.dataset.project !== slot.text) {
          loadingFrame.dataset.project = slot.text
          loadingStartedAt = performance.now()
          loadingFrame.getAnimations().forEach(animation => animation.cancel())
          if (!reducedMotion.matches) loadingFrame.animate({ opacity: [0, 1] }, revealMs)
        }
      }
    }

    function loadNextPoster()
    {
      const slot = frameSlots[frames.length]
      if (!slot) return
      initFrame(slot.x, slot.y, slot.text)
      positionLoadingFrame()
      updateVisibleFrames()
      ensureAnimating()
      if (frames.length < frameSlots.length) scheduleNextPoster()
    }

    function scheduleNextPoster()
    {
      // Paint each ready poster before packing the next one.
      requestAnimationFrame(() => setTimeout(loadNextPoster, 0))
    }

    function setupAndDraw()
    {
      if (animationFrameId)
      {
        cancelAnimationFrame(animationFrameId)
        animationFrameId = null
      }
      isAnimating = false
      const previousFrames = frames.splice(0)
      githubIcons.length = 0
      wipIcons.length = 0

      // --- Layout Constants ---
      const frameW = 300
      const frameH = 400
      const spacing = 40
      const rowGap = 88       // 행 사이 간격 (github 아이콘 영역 포함)
      const bottomIconArea = 50
      // 512 이하 1열, 1024 이하 2열, 초과 4열

      // --- Grid Layout ---
      const viewportW = document.documentElement.clientWidth
      const cols = viewportW <= 512 ? 1 : viewportW <= 1024 ? 2 : 4
      const padding = cols === 1 ? 16 : 60
      const rows = Math.ceil(framesData.length / cols)
      const cellX = i => padding + (i % cols) * (frameW + spacing)
      const cellY = i => padding + Math.floor(i / cols) * (frameH + rowGap)

      // --- Canvas Sizing ---
      const canvasWrapper = canvas.parentElement
      const canvasW = frameW * cols + spacing * (cols - 1) + padding * 2
      const canvasH = padding * 2 + frameH * rows + rowGap * (rows - 1) + bottomIconArea

      // iOS 사파리는 캔버스 한 변이 8192px를 넘으면 그 영역을 제대로 래스터화하지 못해
      // 액자가 부분적으로 깜빡인다. 모바일 1열에서는 캔버스가 6000px 가까이 길어져
      // devicePixelRatio 3이면 18000px가 되어 이 한계를 넘는다. 논리 해상도는 그대로 두고
      // 배율만 낮춘다 (2배를 넘겨봐야 눈에 보이는 차이도 거의 없다).
      const MAX_CANVAS_SIDE = 8192
      const dpr = Math.min(window.devicePixelRatio || 1, 2, MAX_CANVAS_SIDE / canvasW, MAX_CANVAS_SIDE / canvasH)

      // 터치 화면에서는 액자와 아이콘이 화면 높이 안에도 들어오도록 제한한다.
      const availW = viewportW - 40
      const viewportH = window.visualViewport?.height || window.innerHeight
      const heightScale = supportsHover ? 1 : Math.max(1, viewportH - 40) / (frameH + bottomIconArea)
      const fitScale = Math.min(1, availW / canvasW, heightScale)
      canvasSize = { w: canvasW, h: canvasH, scale: fitScale }
      // 아이콘의 도트만 페이지 제목과 같은 화면상 크기로 유지한다.
      pixelSize = parseFloat(getComputedStyle(document.querySelector('h3')).fontSize) / 8 / fitScale
      const displayW = canvasW * fitScale
      const displayH = canvasH * fitScale

      canvasWrapper.style.width = displayW + 'px'
      canvasWrapper.style.paddingBottom = '0px'

      canvas.width = canvasW * dpr
      canvas.height = canvasH * dpr
      canvas.style.width = displayW + 'px'
      canvas.style.height = displayH + 'px'
      ctx.resetTransform()
      ctx.scale(dpr, dpr)

      // --- Initialize Frames ---
      frameSlots = framesData.map(({ text }, i) => ({ text, x: cellX(i), y: cellY(i) }))
      previousFrames.forEach((frame, i) => initFrame(frameSlots[i].x, frameSlots[i].y, frame.text, frame))
      positionLoadingFrame()

      // --- Run Animation Loop ---
      updateVisibleFrames()
      ensureAnimating()
    }

    function updateVisibleFrames()
    {
      if (supportsHover || !canvasSize) return
      const rect = canvas.getBoundingClientRect()
      const viewport = window.visualViewport
      const top = viewport?.offsetTop || 0
      const left = viewport?.offsetLeft || 0
      const bottom = top + (viewport?.height || window.innerHeight)
      const right = left + (viewport?.width || document.documentElement.clientWidth)
      const scaleX = rect.width / canvasSize.w, scaleY = rect.height / canvasSize.h
      const next = new Set()
      frames.forEach(frame =>
      {
        const frameTop = rect.top + frame.fy * scaleY
        const frameBottom = frameTop + 400 * scaleY
        const frameLeft = rect.left + frame.fx * scaleX
        const frameRight = frameLeft + 300 * scaleX
        if (frameTop >= top - 0.5 && frameBottom <= bottom + 0.5 && frameLeft >= left - 0.5 && frameRight <= right + 0.5)
        {
          next.add(frame.text)
        }
      })
      const changed = next.size !== visibleFrameTexts.size || [...next].some(text => !visibleFrameTexts.has(text))
      visibleFrameTexts = next
      if (changed) ensureAnimating()
    }

    function queueVisibilityUpdate()
    {
      if (supportsHover || visibilityAnimationFrameId !== null) return
      visibilityAnimationFrameId = requestAnimationFrame(() =>
      {
        visibilityAnimationFrameId = null
        updateVisibleFrames()
      })
    }

    const projectList = document.getElementById('project-list')
    const projectDescriptions = new Map()
    for (const project of framesData)
    {
      const item = document.createElement('li')
      item.hidden = true
      if (project.link) {
        const link = document.createElement('a')
        link.href = project.link
        link.target = '_blank'
        link.rel = 'noopener'
        item.appendChild(link)
      }
      projectList.appendChild(item)
      projectDescriptions.set(project.text, item)
    }

    function setPosterLanguage(frame, language)
    {
      const project = frameByText[frame.text]
      const copy = project[language]
      const title = copy.title ?? project.text
      const palette = framesData[Math.floor(Math.random() * framesData.length)].palette
      try {
        frame.poster = makeTypePoster(posterShapes[frameLabel(project.text)], copy.passage,
                                      palette, copy.keywords, copy.terms, title, language, frame.poster?.pieces)
      } catch (error) {
        console.error('Could not prepare poster:', project.text, error)
        if (frame.poster) return
      }
      frame.language = language
      if (frame.poster) {
        frame.positions = new Float64Array(frame.poster.pieces.length)
        frame.origins = new Float64Array(frame.poster.pieces.length)
      }
      const item = projectDescriptions.get(frame.text)
      item.hidden = false
      item.lang = language
      const description = item.firstElementChild || item
      description.textContent = title.replace(/\n/g, ' ') + ' — ' + copy.passage
    }

    function initFrame(fx, fy, text, previous)
    {
      const frameW = 300, frameH = 400, border = 18
      const frame = previous ?? { text, isHovered: false, progress: 0, startedAt: 0 }
      frame.fx = fx
      frame.fy = fy
      if (!previous) {
        setPosterLanguage(frame, Math.random() < 0.5 ? 'ko' : 'en')
        frame.readyAt = performance.now()
        frame.enteredAt = frames.length === 0 ? loadingStartedAt : frame.readyAt
      }

      frame.drawStatic = () =>
      {
        ctx.save()
        ctx.shadowColor = 'rgba(0, 0, 0, 0.18)'; ctx.shadowBlur = 30
        ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 6
        ctx.fillStyle = '#f0f0f0'; ctx.fillRect(fx, fy, frameW, frameH)
        ctx.restore()
        ctx.fillStyle = '#f0f0f0'; ctx.fillRect(fx, fy, frameW, frameH)
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)'; ctx.lineWidth = 1
        ctx.strokeRect(fx + 0.5, fy + 0.5, frameW - 1, frameH - 1)
        ctx.fillStyle = '#fffefd'; ctx.fillRect(fx + border, fy + border, frameW - border * 2, frameH - border * 2)
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.04)'; ctx.lineWidth = 0.5
        ctx.strokeRect(fx + border, fy + border, frameW - border * 2, frameH - border * 2)
      }

      frames.push(frame)
      const project = frameByText[text]
      if (project.repo) registerGithubIcon(fx + frameW / 2, fy + frameH + 28, frame)
      if (project.wip) wipIcons.push({ x: fx + frameW / 2, y: fy + frameH + 28, frame })
    }

    function registerGithubIcon(x, y, frame)
    {
      githubIcons.push({
        x,
        y,
        size: 32,
        radius: 20,
        frame,
        projectKey: frame.text,
        href: frameByText[frame.text].repo
      })
    }

    function getHoveredGithubIcon(x, y)
    {
      return githubIcons.find(icon => Math.hypot(x - icon.x, y - icon.y) <= icon.radius) || null
    }

    function drawGithubIcon(icon, isHovered)
    {
      const cells = Math.max(1, Math.round(icon.size / pixelSize))
      if (!pixelIconCache.has(cells))
      {
        const path = new Path2D()
        for (let row = 0; row < cells; row++)
        {
          for (let col = 0; col < cells; col++)
          {
            if (iconContext.isPointInPath(GITHUB_ICON_PATH, (col + 0.5) * 16 / cells, (row + 0.5) * 16 / cells))
              path.rect(col - cells / 2, row - cells / 2, 1, 1)
          }
        }
        pixelIconCache.set(cells, path)
      }
      ctx.save()
      ctx.globalAlpha = icon.frame.revealOpacity
      ctx.translate(icon.x, icon.y)
      ctx.scale(pixelSize, pixelSize)
      ctx.fillStyle = isHovered ? '#000000' : '#555555'
      ctx.fill(pixelIconCache.get(cells))
      ctx.restore()
    }

    // 공사중 표시용 바리케이드 아이콘. github 아이콘과 같은 색/자리에 그리되 상호작용은 없다.
    function drawWipIcon(icon)
    {
      ctx.save()
      ctx.globalAlpha = icon.frame.revealOpacity
      ctx.translate(icon.x, icon.y)
      ctx.scale(pixelSize, pixelSize)
      ctx.fillStyle = '#555555'
      ctx.fill(WIP_ICON_PATH)
      ctx.restore()
    }

    // 글자가 모이거나 흩어지는 동작이 끝나면 루프를 멈춘다. 캔버스가 커서(모바일 1열 기준 약 420x5938)
    // 가만히 있는 동안에도 매 프레임 전체를 지우고 다시 그리면 iOS 사파리에서 액자가
    // 깜빡인다. 입력(마우스 이동/이탈/클릭)이나 재레이아웃이 들어오면 다시 돌린다.
    function ensureAnimating()
    {
      if (isAnimating || !canvasSize) return
      isAnimating = true
      animationFrameId = requestAnimationFrame(time => animate(canvasSize.w, canvasSize.h, time))
    }

    function animate(canvasW, canvasH, time)
    {
      const frameW = 300, frameH = 400
      ctx.clearRect(0, 0, canvasW, canvasH)
      let cursorToSet = 'default'
      let stillAnimating = false
      const hoveredGithubIcon = getHoveredGithubIcon(mouse.x, mouse.y)
      const opacitySince = start => reducedMotion.matches ? 1 : Math.min(1, Math.max(0, (time - start) / revealMs))

      frames.forEach(frame =>
      {
        // Continue the first placeholder's fade; later frames fade in with their text.
        ctx.save()
        ctx.globalAlpha = opacitySince(frame.enteredAt)
        frame.drawStatic()
        ctx.restore()
        frame.revealOpacity = opacitySince(frame.readyAt)
        if (frame.revealOpacity < 1) stillAnimating = true
        const isHovered = supportsHover
          ? mouse.x >= frame.fx && mouse.x <= frame.fx + frameW && mouse.y >= frame.fy && mouse.y <= frame.fy + frameH
          : visibleFrameTexts.has(frame.text)
        const frameData = frameByText[frame.text]
        if (isHovered && frameData && frameData.link) { cursorToSet = 'pointer' }

        if (!frame.poster) {
          ctx.save()
          ctx.globalAlpha = frame.revealOpacity
          ctx.font = '18px "Press Start 2P", monospace'
          ctx.fillStyle = '#555'
          ctx.textAlign = 'center'
          ctx.fillText(frame.text.replace(/\n/g, ' '), frame.fx + frameW / 2, frame.fy + frameH / 2, frameW - 60)
          ctx.restore()
          return
        }
        if (isHovered && !frame.isHovered && typeof gtag === 'function')
          gtag('event', 'frame_hover', { frame: frameLabel(frame.text), interaction: supportsHover ? 'mouseover' : 'scroll' })
        const target = isHovered ? 1 : 0
        if (frame.isHovered !== isHovered)
        {
          frame.origins.set(frame.positions)
          frame.isHovered = isHovered
          frame.startedAt = time
          frame.progress = 1 - target
        }
        if (frame.progress !== target)
        {
          const elapsed = time - frame.startedAt
          const duration = isHovered ? posterGatherMs : characterTravelMs
          const fraction = reducedMotion.matches ? 1 : Math.min(1, elapsed / duration)
          frame.progress = isHovered ? fraction : 1 - fraction
          if (fraction === 1)
          {
            frame.positions.fill(target)
            // Only change editions after a completed scatter. A quick re-entry
            // reverses the same letters from their current positions.
            if (!isHovered)
            {
              frame.outgoing = reducedMotion.matches ? null : frame.poster.scattered
              frame.languageChangedAt = time
              setPosterLanguage(frame, frame.language === 'ko' ? 'en' : 'ko')
            }
          }
          else
          {
            stillAnimating = true
            frame.poster.pieces.forEach((piece, i) =>
            {
              const phase = isHovered ? Math.max(0, Math.min(1, (elapsed - piece.startMs) / characterTravelMs)) : fraction
              const ease = phase * phase * (3 - 2 * phase)
              frame.positions[i] = frame.origins[i] + (target - frame.origins[i]) * ease
            })
          }
        }

        ctx.save()
        ctx.translate(frame.fx + 30, frame.fy + 50)
        const blend = frame.outgoing && !reducedMotion.matches
          ? Math.min(1, (time - frame.languageChangedAt) / 140) : 1
        ctx.globalAlpha = frame.revealOpacity * blend
        if (frame.progress === target)
        {
          const image = frame.progress === 1 ? frame.poster.assembled : frame.poster.scattered
          ctx.drawImage(image, 0, 0, image.width / 2, image.height / 2)
        }
        else drawPosterPieces(ctx, frame.poster, frame.progress, frame.positions)
        if (frame.outgoing)
        {
          if (blend < 1)
          {
            ctx.globalAlpha = frame.revealOpacity * (1 - blend)
            ctx.drawImage(frame.outgoing, 0, 0, frame.outgoing.width / 2, frame.outgoing.height / 2)
            stillAnimating = true
          }
          else frame.outgoing = null
        }
        ctx.restore()

      })
      githubIcons.forEach(icon => drawGithubIcon(icon, hoveredGithubIcon === icon))
      wipIcons.forEach(drawWipIcon)
      if (hoveredGithubIcon)
      {
        cursorToSet = 'pointer'
      }
      canvas.style.cursor = cursorToSet
      isAnimating = false
      animationFrameId = null
      if (stillAnimating) ensureAnimating()
    }

    // --- Event Listeners ---
    canvas.addEventListener('mousemove', (e) =>
    {
      if (!supportsHover || !canvasSize) return
      const rect = canvas.getBoundingClientRect()
      mouse.x = (e.clientX - rect.left) * (canvasSize.w / rect.width)
      mouse.y = (e.clientY - rect.top) * (canvasSize.h / rect.height)
      ensureAnimating()
    })
    canvas.addEventListener('mouseleave', () => { if (supportsHover) { mouse.x = -1000; mouse.y = -1000; ensureAnimating() } })
    canvas.addEventListener('click', (e) =>
    {
      if (!canvasSize) return
      const rect = canvas.getBoundingClientRect()
      const clickX = (e.clientX - rect.left) * (canvasSize.w / rect.width)
      const clickY = (e.clientY - rect.top) * (canvasSize.h / rect.height)
      const clickedGithubIcon = getHoveredGithubIcon(clickX, clickY)

      if (clickedGithubIcon)
      {
        if (typeof gtag === 'function')
        {
          gtag('event', 'link_click', {
            link_type: 'github',
            frame: frameLabel(clickedGithubIcon.projectKey),
            link_url: clickedGithubIcon.href
          })
        }
        window.open(clickedGithubIcon.href, "_blank")
        return
      }

      const frameW = 300, frameH = 400
      const clickedFrame = frames.find(frame =>
        clickX >= frame.fx && clickX <= frame.fx + frameW && clickY >= frame.fy && clickY <= frame.fy + frameH)

      const clickedFrameLink = clickedFrame && frameByText[clickedFrame.text]?.link
      if (clickedFrameLink)
      {
        if (typeof gtag === 'function')
        {
          gtag('event', 'link_click', {
            link_type: 'project',
            frame: frameLabel(clickedFrame.text),
            link_url: clickedFrameLink
          })
        }
        window.open(clickedFrameLink, "_blank")
      }
      // 이동할 링크가 없는 액자(준비중/저장소만 있는 항목)도 관심도 집계를 위해 기록한다.
      else if (clickedFrame && typeof gtag === 'function')
      {
        gtag('event', 'frame_click', {
          frame: frameLabel(clickedFrame.text),
          link_type: frameByText[clickedFrame.text]?.wip ? 'wip' : 'none'
        })
      }
    })

    // --- Initial Load and Resize ---
    window.addEventListener('scroll', queueVisibilityUpdate, { passive: true })
    window.visualViewport?.addEventListener('scroll', queueVisibilityUpdate, { passive: true })
    window.visualViewport?.addEventListener('resize', queueVisibilityUpdate, { passive: true })
    window.addEventListener('resize', setupAndDraw)
    // 액자 자리는 즉시 잡고, 글자 배치는 폰트와 포스터 스크립트가 준비된 뒤 시작한다.
    const posterFonts = document.fonts
      ? [document.fonts.load('16px "Press Start 2P"'), document.fonts.load('16px Jua', '한글')]
      : []
    setupAndDraw()
    document.addEventListener('DOMContentLoaded', () => {
      Promise.allSettled(posterFonts).then(scheduleNextPoster)
    }, { once: true })
    // 유휴 상태에서는 다시 그리지 않으므로, 탭 복귀/bfcache 복원처럼 캔버스 내용이
    // 날아갈 수 있는 시점에는 한 프레임 다시 그려 둔다.
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { queueVisibilityUpdate(); ensureAnimating() } })
    window.addEventListener('pageshow', () => { queueVisibilityUpdate(); ensureAnimating() })
    // 타이밍에 의존하지 않도록 실제 레이아웃 폭이 확정/변경될 때마다 다시 그린다.
    // (첫 로드 시 innerWidth가 잘못 읽혀 가로로 넘치는 문제 해결, 수동 resize 불필요)
    if (window.ResizeObserver) {
      let lastW = -1
      const ro = new ResizeObserver(() => {
        const w = document.documentElement.clientWidth
        if (w === lastW) return
        lastW = w
        requestAnimationFrame(setupAndDraw)
      })
      ro.observe(document.documentElement)
    }
  </script>
