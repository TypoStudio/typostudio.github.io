  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      padding: 40px 0 0;
      background: #e8e8e8;
      font-family: serif;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: min(1100px, calc(100vw - 40px));
      margin-bottom: 20px;
    }

    h3 {
      font-weight: 400;
      color: #333;
      margin: 0;
    }

    .coffee-link {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      min-height: 44px;
      color: #333;
      font-family: inherit;
      font-size: 0.65rem;
      line-height: 1.8;
      text-decoration: none;
    }

    .coffee-link:hover,
    .coffee-link:focus-visible {
      text-decoration: underline;
      text-underline-offset: 0.3em;
    }

    canvas {
      display: block;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      padding-bottom: 20px;
      color: #888;
      font-size: 0.9em;
    }

    .theme-toggle {
      margin-top: 16px;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 0.9em;
      cursor: pointer;
    }

    /* 8비트 LCD 픽셀 테마 (하단 버튼으로 body.pixel-theme 토글) — 액자(canvas)는 영향 없음 */
    :root {
      --lcd-bg: #c9c9c9;        /* 하단 하드웨어 배경 패널 색상 (회색) */
      --pixel-color: #65676a;   /* 픽셀 소자 자체의 색상 */
      --pixel-size: 4px;        /* 물리적 도트 최소 단위 */
    }

    body.pixel-theme {
      background-color: var(--lcd-bg);
      background-image:
        linear-gradient(to right, rgba(0, 0, 0, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 0, 0, 0.04) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    body.pixel-theme h3,
    body.pixel-theme .coffee-link,
    body.pixel-theme footer,
    body.pixel-theme .theme-toggle {
      font-family: 'Press Start 2P', monospace;
      color: var(--pixel-color);
      image-rendering: pixelated;
      /* 픽셀 도트가 배경에 드리우는 그림자 */
      text-shadow: 3px 3px 3px rgba(83, 83, 83, 0.25);
    }

    body.pixel-theme h3 {
      font-size: 1.4rem;
    }

    body.pixel-theme footer {
      font-size: 0.6rem;
      line-height: 1.8;
    }

    body.pixel-theme .theme-toggle {
      background: var(--lcd-bg);
      border: var(--pixel-size) solid var(--pixel-color);
      padding: 12px 18px;
      box-shadow: 4px 4px 1px rgba(92, 67, 8, 0.35);
    }

    body.pixel-theme .theme-toggle:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 1px rgba(92, 67, 8, 0.35);
    }

    /* Responsive styles */
    @media (max-width: 1100px) {
      body {
        padding-top: 80px;
      }

      .frame-container {
        margin: 0 auto !important;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

        margin-top: 20px;
        padding-bottom: 20px;
      }
    }

    @media (max-width: 600px) {
      .header {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
    }

  <script>
    // --- Global State ---
    const canvas = document.getElementById('canvas')
    const ctx = canvas.getContext('2d')
    const frames = []
    const githubIcons = []
    const wipIcons = []
    let mouse = { x: -1000, y: -1000 }
    let animationFrameId = null
    // 캔버스의 논리 크기(=그리기 좌표계). devicePixelRatio를 낮춰 잡는 경우가 있어
    // 마우스 좌표 환산에는 canvas.width가 아니라 이 값을 쓴다.
    let canvasSize = null
    let isAnimating = false
    // 마우스(hover 가능한 입력장치)가 하나라도 있으면 true. 터치스크린 데스크톱/노트북에서도
    // 마우스오버가 켜지도록 (hover: hover)가 아닌 (any-hover: hover) 사용.
    const supportsHover = window.matchMedia('(any-hover: hover)').matches
    // 터치 기기에서는 화면 안에 완전히 들어온 액자의 글자를 모은다.
    let visibleFrameTexts = new Set()
    let visibilityAnimationFrameId = null
    const fonts = ["serif", "sans-serif", "monospace", "cursive", "fantasy"]
    const descriptionFont = '"Noto Serif KR", "AppleMyungjo", "Batang", serif'
    const quarterTurn = Math.PI / 2
    const GITHUB_ICON_PATH = new Path2D("M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z")
    // 액자 정보 단일 소스. description: 액자 안에 작게 흩뿌릴 설명 문구.
    // text: 액자에 들어가는 글자, link: 프로젝트(데모) 링크, repo: github 저장소.
    // wip: true면 액자 아래에 공사중 아이콘을 그린다(클릭 대상 아님).
    // 배치 순서, github 아이콘 표시 여부, 링크 동작이 모두 이 배열에서 파생된다.
    // text 안의 줄바꿈(\n)이 액자 안 글자의 줄 구성을 결정한다. 줄별 글자 수와 줄 개수로
    // 위치를 계산하므로(아래 initFrame) 새 항목은 분기 추가 없이 자동 배치된다.
    const framesData = [
      { text: "TYPHOON\nLAB", description: ["세계 지도에서 바다와 대기 조건으로 태풍을 만들고 도시를 지키는 날씨 시뮬레이션"], link: "https://typhoon.typostudio.dev/", repo: "https://github.com/TypoStudio/typhoon-lab" },
      { text: "AI\nUSAGE", description: ["클로드 코드와 코덱스 여러 계정의 사용 한도를 활동 링으로 보여 주는 맥 바탕화면 위젯"], link: null, repo: "https://github.com/TypoStudio/ai-usage" },
      { text: "HOUSE\nBUDGET", description: ["내 구글 시트에 월별 수입과 지출을 기록하고 이월잔고를 계산하는 웹 가계부"], link: "https://house-budget.typostudio.dev/", repo: "https://github.com/TypoStudio/h-budget" },
      { text: "FAMILY\nSITE\nLINK", description: ["가족 기기의 접속 가능한 사이트와 사이트별 사용 시간을 관리하는 서비스"], link: "https://familysitelink.typostudio.dev/", repo: null },
      { text: "MATCH\nIT", description: ["한자와 영어 단어 수학 공식의 정답 조각을 맞춰 없애며 배우는 퍼즐 게임"], link: "https://matchit.typostudio.dev", repo: "https://github.com/TypoStudio/matchit" },
      { text: "SNATCH", description: ["제목 표시줄을 잡지 않고 보조 키와 마우스 움직임만으로 맥의 창을 옮기고 크기를 바꾸는 앱"], link: null, repo: "https://github.com/TypoStudio/snatch" },
      { text: "FOCUS\nPLAY", description: ["전체 화면 영상 재생을 감지해 다른 모니터를 자동으로 어둡게 만드는 맥 메뉴 막대 앱"], link: null, repo: "https://github.com/TypoStudio/focus-play" },
      { text: "QL\nZIP\nLIST", description: ["압축을 풀지 않고 파인더에서 파일 트리와 크기 수정 날짜를 확인하는 빠른 보기 확장"], link: null, repo: "https://github.com/TypoStudio/qlziplist" },
      { text: "EINK\nCLOCK", description: ["전자잉크와 전자책 단말기에 맞춘 웹 시계로 디지털과 아날로그 모드 날씨 달력을 제공"], link: "https://typostudio.github.io/einkclock/", repo: "https://github.com/TypoStudio/einkclock" },
      { text: "SSH\nTUNNEL\nMANAGER", description: ["맥 메뉴 막대에서 SSH 터널을 연결하고 포트 포워딩 규칙을 관리하는 앱"], link: null, repo: "https://github.com/TypoStudio/ssh-tunnel-for-macos" },
      { text: "DOUBLE\nPENDULUM", description: ["이중 진자와 삼체 궤도 탐사선의 스윙바이로 혼돈과 중력 운동을 살펴보는 시뮬레이션"], link: "https://typostudio.github.io/double-pendulum/", repo: "https://github.com/TypoStudio/double-pendulum" },
      { text: "TRIP\nBALL", description: ["실제 지도 위를 감자 캐릭터로 탐험하며 공을 차고 사물을 배치하는 물리 기반 게임"], link: null, repo: null, wip: true },
    ]
    const frameByText = Object.fromEntries(framesData.map(f => [f.text, f]))
    // GA 이벤트/식별용 라벨: 줄바꿈 제거한 순수 이름
    const frameLabel = t => t.replace(/\n/g, "")


    // --- Main Setup and Drawing Function ---
    function setupAndDraw()
    {
      if (animationFrameId)
      {
        cancelAnimationFrame(animationFrameId)
        animationFrameId = null
      }
      isAnimating = false
      frames.length = 0 // Clear frames for redraw
      githubIcons.length = 0
      wipIcons.length = 0

      // --- Layout Constants ---
      const frameW = 300
      const frameH = 400
      const border = 18
      const letterMargin = 12
      const spacing = 40
      const padding = 60
      const rowGap = 88       // 행 사이 간격 (github 아이콘 영역 포함)
      const bottomIconArea = 50
      // 512 이하 1열, 1024 이하 2열, 초과 4열

      // --- Grid Layout ---
      const viewportW = document.documentElement.clientWidth
      const cols = viewportW <= 512 ? 1 : viewportW <= 1024 ? 2 : 4
      const layout = framesData.map(f => f.text)
      const iconKeys = framesData.filter(f => f.repo).map(f => f.text)
      const wipKeys = framesData.filter(f => f.wip).map(f => f.text)
      const rows = Math.ceil(layout.length / cols)
      const cellX = i => padding + (i % cols) * (frameW + spacing)
      const cellY = i => padding + Math.floor(i / cols) * (frameH + rowGap)

      // --- Canvas Sizing ---
      const canvasWrapper = canvas.parentElement
      const canvasW = frameW * cols + spacing * (cols - 1) + padding * 2
      const canvasH = padding * 2 + frameH * rows + rowGap * (rows - 1) + bottomIconArea
      canvasSize = { w: canvasW, h: canvasH }

      // iOS 사파리는 캔버스 한 변이 8192px를 넘으면 그 영역을 제대로 래스터화하지 못해
      // 액자가 부분적으로 깜빡인다. 모바일 1열에서는 캔버스가 6000px 가까이 길어져
      // devicePixelRatio 3이면 18000px가 되어 이 한계를 넘는다. 논리 해상도는 그대로 두고
      // 배율만 낮춘다 (2배를 넘겨봐야 눈에 보이는 차이도 거의 없다).
      const MAX_CANVAS_SIDE = 8192
      const dpr = Math.min(window.devicePixelRatio || 1, 2, MAX_CANVAS_SIDE / canvasW, MAX_CANVAS_SIDE / canvasH)

      // 터치 화면에서는 액자와 아이콘이 화면 높이 안에도 들어오도록 제한한다.
      const availW = viewportW - 40
      const viewportH = window.visualViewport?.height || window.innerHeight
      const heightScale = supportsHover ? 1 : Math.max(1, viewportH - 40) / (frameH + bottomIconArea)
      const fitScale = Math.min(1, availW / canvasW, heightScale)
      const displayW = canvasW * fitScale
      const displayH = canvasH * fitScale

      canvasWrapper.style.width = displayW + 'px'
      canvasWrapper.style.paddingBottom = '0px'

      canvas.width = canvasW * dpr
      canvas.height = canvasH * dpr
      canvas.style.width = displayW + 'px'
      canvas.style.height = displayH + 'px'
      ctx.resetTransform()
      ctx.scale(dpr, dpr)

      // --- Initialize Frames ---
      layout.forEach((text, i) => initFrame(cellX(i), cellY(i), text, true))
      iconKeys.forEach(key =>
      {
        const i = layout.indexOf(key)
        registerGithubIcon(cellX(i) + frameW / 2, cellY(i) + frameH + 28, key)
      })
      wipKeys.forEach(key =>
      {
        const i = layout.indexOf(key)
        wipIcons.push({ x: cellX(i) + frameW / 2, y: cellY(i) + frameH + 28 })
      })

      // --- Run Animation Loop ---
      updateVisibleFrames()
      ensureAnimating()
    }

    function updateVisibleFrames()
    {
      if (supportsHover || !canvasSize) return
      const rect = canvas.getBoundingClientRect()
      const viewport = window.visualViewport
      const top = viewport?.offsetTop || 0
      const left = viewport?.offsetLeft || 0
      const bottom = top + (viewport?.height || window.innerHeight)
      const right = left + (viewport?.width || document.documentElement.clientWidth)
      const scaleX = rect.width / canvasSize.w, scaleY = rect.height / canvasSize.h
      const next = new Set()
      frames.forEach(frame =>
      {
        const frameTop = rect.top + frame.fy * scaleY
        const frameBottom = frameTop + 400 * scaleY
        const frameLeft = rect.left + frame.fx * scaleX
        const frameRight = frameLeft + 300 * scaleX
        if (frameTop >= top - 0.5 && frameBottom <= bottom + 0.5 && frameLeft >= left - 0.5 && frameRight <= right + 0.5)
        {
          next.add(frame.text)
        }
      })
      const changed = next.size !== visibleFrameTexts.size || [...next].some(text => !visibleFrameTexts.has(text))
      visibleFrameTexts = next
      if (changed) ensureAnimating()
    }

    function queueVisibilityUpdate()
    {
      if (supportsHover || visibilityAnimationFrameId !== null) return
      visibilityAnimationFrameId = requestAnimationFrame(() =>
      {
        visibilityAnimationFrameId = null
        updateVisibleFrames()
      })
    }

    // 액자별 글자 배치(글자/크기/폰트/각도/좌표)는 페이지 로딩 시 액자당 한 번만 만들어 캐시한다.
    // 좌표는 액자 좌상단 기준 상대값이라, 화면 크기가 바뀌어 액자가 다른 칸으로 옮겨가도
    // 재배치(재랜덤) 없이 위치만 옮겨 쓴다. 배치 계산은 글자당 최대 300회 충돌 검사라
    // 비싼데, 예전에는 로딩/리사이즈마다 다시 굴러서 모바일에서 화면이 멎었다.
    const letterLayoutCache = {}
    const descriptionLayoutCache = {}

    function createLetterLayout(text)
    {
      const frameW = 300, frameH = 400, border = 18, letterMargin = 12
      const rawLetters = text.replace(/\n/g, "").split("").map(l => Math.random() > 0.5 ? l.toUpperCase() : l.toLowerCase())
      const innerW = frameW - border * 2, innerH = frameH - border * 2
      const placed = [], verticalSegment = innerH / rawLetters.length
      const extraBigIndex = Math.floor(Math.random() * rawLetters.length)
      const bigIndices = []
      while (bigIndices.length < 2 && rawLetters.length > 3)
      {
        const r = Math.floor(Math.random() * rawLetters.length)
        if (r !== extraBigIndex && !bigIndices.includes(r)) bigIndices.push(r)
      }

      return rawLetters.map((char, i) =>
      {
        let fontSize = Math.floor(Math.random() * (verticalSegment * 0.5)) + 30
        if (i === extraBigIndex) fontSize *= 3.5; else if (bigIndices.includes(i)) fontSize *= 2.0

        const font = fonts[Math.floor(Math.random() * fonts.length)], radius = fontSize * 0.45
        const segmentTop = i * verticalSegment
        let dx, dy, baseAngle, found = false, bestX, bestY, minOverlap = Infinity

        for (let attempt = 0; attempt < 300; attempt++)
        {
          let tx = radius + Math.random() * (innerW - radius * 2)
          let ty = segmentTop + radius + Math.random() * (verticalSegment - radius * 2)
          tx = Math.max(radius + letterMargin, Math.min(tx, innerW - radius - letterMargin))
          ty = Math.max(radius + letterMargin, Math.min(ty, innerH - radius - letterMargin))
          let maxOverlap = 0, overlapCount = 0
          for (const other of placed)
          {
            const dist = Math.sqrt((tx - other.x) ** 2 + (ty - other.y) ** 2)
            const overlap = (radius + other.radius) - dist
            if (overlap > 0) { overlapCount++; maxOverlap = Math.max(maxOverlap, overlap) }
          }
          if (overlapCount === 0) { dx = tx; dy = ty; found = true; break }
          if (maxOverlap < minOverlap) { minOverlap = maxOverlap; bestX = tx; bestY = ty }
        }
        if (!found) { dx = bestX; dy = bestY }
        placed.push({ x: dx, y: dy, radius })

        if (i === 0) baseAngle = 0
        else
        {
          const confusingChars = "nupdbqIl1NZ690oO"
          if (confusingChars.includes(char)) baseAngle = (Math.random() > 0.5) ? 0 : Math.PI / 2
          else baseAngle = [0, Math.PI / 2, Math.PI, Math.PI * .5][Math.floor(Math.random() * 4)]
        }

        // 안쪽 영역 기준 좌표를 액자 좌상단 기준으로 환산해 둔다.
        return { char, dx: border + dx, dy: border + dy, baseAngle, fontSize, font, index: i }
      })
    }

    function createDescriptionLayout(frame)
    {
      // 설명의 난수는 별도로 생성해 기존 제목의 무작위 배치에 영향을 주지 않는다.
      let seed = Array.from(frame.text).reduce((hash, char) => Math.imul(hash ^ char.codePointAt(0), 16777619), 2166136261)
      const random = () => { seed = Math.imul(seed, 1664525) + 1013904223 | 0; return (seed >>> 0) / 4294967296 }
      ctx.save()
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      const occupied = frame.letters.map(l =>
      {
        ctx.font = `bold ${l.targetFontSize}px ${l.font}`
        const m = ctx.measureText(l.char)
        return {
          left: l.targetX - frame.fx - m.actualBoundingBoxLeft - 4,
          right: l.targetX - frame.fx + m.actualBoundingBoxRight + 4,
          top: l.targetY - frame.fy - m.actualBoundingBoxAscent - 4,
          bottom: l.targetY - frame.fy + m.actualBoundingBoxDescent + 4
        }
      })
      const text = (frameByText[frame.text].description || []).join(' ')
      if (!text.trim()) { ctx.restore(); return [] }
      const characters = Array.from(text.replace(/\s/g, ''))
      const preferredSize = 26
      // 기존 크기를 중심으로 조금씩 달라지게 하고, 배치와 겹침 검사에도 실제 크기를 쓴다.
      const sizeOffsets = characters.map(() => Math.floor(random() * 9) - 4)
      let layout = []

      // 제목을 피해 액자 전체에 기준 격자를 만들고, 설명을 읽는 순서대로 놓는다.
      for (let fontSize = preferredSize; fontSize >= 20; fontSize--)
      {
        const sizes = sizeOffsets.map(offset => fontSize + offset)
        const metrics = characters.map((char, index) =>
        {
          ctx.font = `${sizes[index]}px ${descriptionFont}`
          return ctx.measureText(char)
        })
        const leftInk = Math.max(...metrics.map(m => m.actualBoundingBoxLeft))
        const rightInk = Math.max(...metrics.map(m => m.actualBoundingBoxRight))
        const ascent = Math.max(...metrics.map(m => m.actualBoundingBoxAscent))
        const descent = Math.max(...metrics.map(m => m.actualBoundingBoxDescent))
        const left = 26 + leftInk, right = 274 - rightInk
        const top = 26 + ascent, bottom = 374 - descent
        const maxCols = Math.floor((right - left) / (leftInk + rightInk + 4)) + 1
        const maxRows = Math.floor((bottom - top) / (ascent + descent + 4)) + 1
        let best = null, bestScore = Infinity
        for (let cols = 4; cols <= maxCols; cols++)
        {
          for (let rows = 5; rows <= maxRows; rows++)
          {
            const stepX = (right - left) / (cols - 1), stepY = (bottom - top) / (rows - 1)
            const cells = []
            for (let row = 0; row < rows; row++)
            {
              for (let col = 0; col < cols; col++)
              {
                const x = left + col * stepX, y = top + row * stepY
                if (!occupied.some(box => x + rightInk > box.left && x - leftInk < box.right && y + descent > box.top && y - ascent < box.bottom))
                {
                  cells.push({ x, y, row, col })
                }
              }
            }
            if (cells.length < characters.length) continue
            const score = (cells.length - characters.length) * 4 + Math.abs(Math.log(stepX / stepY)) * characters.length
            if (score < bestScore) { best = cells; bestScore = score }
          }
        }
        if (!best) continue

        // 여분의 칸이 있어도 한쪽으로 몰리지 않도록 가장 먼 칸부터 고른다.
        const selected = [best[0]]
        const chosen = new Set(selected)
        while (selected.length < characters.length)
        {
          let next, farthest = -1
          best.forEach(cell =>
          {
            if (chosen.has(cell)) return
            const distance = Math.min(...selected.map(other => (cell.x - other.x) ** 2 + (cell.y - other.y) ** 2))
            if (distance > farthest) { next = cell; farthest = distance }
          })
          selected.push(next)
          chosen.add(next)
        }
        selected.sort((a, b) => a.row - b.row || a.col - b.col)
        layout = characters.map((char, index) => ({
          char, charIndex: index, descriptionIndex: 0, fontSize: sizes[index],
          targetX: selected[index].x, targetY: selected[index].y, targetAngle: 0
        }))
        break
      }

      // 회전한 글자의 실제 외곽 상자로 제목과 설명 사이의 겹침을 검사한다.
      const glyphBounds = (char, fontSize, font, angle, bold = false) =>
      {
        ctx.font = `${bold ? 'bold ' : ''}${fontSize}px ${font}`
        const m = ctx.measureText(char)
        const c = Math.round(Math.cos(angle)), s = Math.round(Math.sin(angle))
        const corners = [
          [-m.actualBoundingBoxLeft, -m.actualBoundingBoxAscent],
          [m.actualBoundingBoxRight, -m.actualBoundingBoxAscent],
          [m.actualBoundingBoxRight, m.actualBoundingBoxDescent],
          [-m.actualBoundingBoxLeft, m.actualBoundingBoxDescent]
        ].map(([x, y]) => ({ x: x * c - y * s, y: x * s + y * c }))
        return {
          left: Math.min(...corners.map(p => p.x)) - 2,
          right: Math.max(...corners.map(p => p.x)) + 2,
          top: Math.min(...corners.map(p => p.y)) - 2,
          bottom: Math.max(...corners.map(p => p.y)) + 2
        }
      }
      const translated = (box, x, y) => ({ left: box.left + x, right: box.right + x, top: box.top + y, bottom: box.bottom + y })
      const overlaps = (a, b) => a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top
      const titleBounds = frame.letters.map(letter => translated(
        glyphBounds(letter.char, letter.fontSize, letter.font, letter.baseAngle, true),
        letter.baseX - frame.fx, letter.baseY - frame.fy
      ))
      let scattered = null
      for (let pass = 0; pass < 12 && !scattered; pass++)
      {
        const placed = titleBounds.slice()
        const positions = []
        const order = layout.map((letter, index) =>
        {
          const angle = Math.floor(random() * 4) * quarterTurn
          const box = glyphBounds(letter.char, letter.fontSize, descriptionFont, angle)
          return { index, angle, box, area: (box.right - box.left) * (box.bottom - box.top) + random() }
        }).sort((a, b) => b.area - a.area)
        for (const item of order)
        {
          const minX = 22 - item.box.left, maxX = 278 - item.box.right
          const minY = 22 - item.box.top, maxY = 378 - item.box.bottom
          let position = null
          const tryPosition = (x, y) =>
          {
            const box = translated(item.box, x, y)
            if (placed.some(other => overlaps(box, other))) return false
            position = { baseX: x, baseY: y, baseAngle: item.angle }
            placed.push(box)
            return true
          }
          for (let attempt = 0; attempt < 600 && !position; attempt++)
          {
            tryPosition(minX + random() * (maxX - minX), minY + random() * (maxY - minY))
          }
          // 무작위 탐색에서 놓친 좁은 빈자리도 검사한다. 겹친 좌표는 사용하지 않는다.
          for (let y = minY; y <= maxY && !position; y += 2)
          {
            for (let x = minX; x <= maxX && !position; x += 2) tryPosition(x, y)
          }
          if (!position) break
          positions[item.index] = position
        }
        if (positions.filter(Boolean).length === layout.length) scattered = positions
      }
      if (!scattered) throw new Error('Unable to place description letters without overlap')
      layout = layout.map((letter, index) => ({
        ...letter, ...scattered[index],
        motion: random() < 0.5 ? 'glide' : 'jump',
        jumpDelay: Math.floor(random() * 6) * 60
      }))
      // 모인 상태도 반듯한 격자에서 조금씩 어긋나게 하되 제목과 이웃 글자를 피한다.
      const targetBounds = layout.map(letter => translated(
        glyphBounds(letter.char, letter.fontSize, descriptionFont, 0), letter.targetX, letter.targetY
      ))
      layout.forEach((letter, index) =>
      {
        const bounds = glyphBounds(letter.char, letter.fontSize, descriptionFont, 0)
        for (let attempt = 0; attempt < 32; attempt++)
        {
          const x = letter.targetX + (random() * 2 - 1) * 6
          const y = letter.targetY + (random() * 2 - 1) * 8
          const box = translated(bounds, x, y)
          if (box.left < 24 || box.right > 276 || box.top < 24 || box.bottom > 376) continue
          if (occupied.some(other => overlaps(box, other))) continue
          if (targetBounds.some((other, otherIndex) => otherIndex !== index && overlaps(box, other))) continue
          letter.targetX = x; letter.targetY = y
          targetBounds[index] = box
          break
        }
      })
      ctx.restore()
      return layout
    }

    function drawFrameDescriptions(frame, isActive, now)
    {
      let moving = false
      ctx.save()
      ctx.beginPath()
      ctx.rect(frame.fx + 18, frame.fy + 18, 264, 364)
      ctx.clip()
      ctx.fillStyle = '#d0d0d0'
      ctx.textAlign = 'center'
      ctx.textBaseline = 'middle'
      frame.descriptions.forEach(letter =>
      {
        const x = isActive ? letter.targetX : letter.baseX
        const y = isActive ? letter.targetY : letter.baseY
        const angle = isActive ? 0 : letter.baseAngle
        if (letter.motion === 'jump')
        {
          // 일부 글자는 짧은 시차를 두고 바로 이동하고, 나머지는 기존처럼 움직인다.
          if (now - frame.transitionStartTime >= letter.jumpDelay)
          {
            letter.currX = x; letter.currY = y; letter.currAngle = angle
          } else moving = true
        } else if (ease(letter, x, y, angle, letter.fontSize)) moving = true
        ctx.save()
        ctx.translate(letter.currX, letter.currY)
        ctx.rotate(Math.round(letter.currAngle / quarterTurn) * quarterTurn)
        ctx.font = `${letter.fontSize}px ${descriptionFont}`
        ctx.fillText(letter.char, 0, 0)
        ctx.restore()
      })
      ctx.restore()
      return moving
    }

    function initFrame(fx, fy, text, isInteractive = false)
    {
      const frameW = 300, frameH = 400, border = 18
      const frame = { fx, fy, text, letters: [], descriptions: [], isHovered: false, wasHovered: false, hoverStartTime: 0, transitionStartTime: 0, mode: 0 }

      frame.drawStatic = () =>
      {
        ctx.save()
        ctx.shadowColor = 'rgba(0, 0, 0, 0.18)'; ctx.shadowBlur = 30
        ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 6
        ctx.fillStyle = '#f0f0f0'; ctx.fillRect(fx, fy, frameW, frameH)
        ctx.restore()
        ctx.fillStyle = '#f0f0f0'; ctx.fillRect(fx, fy, frameW, frameH)
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.05)'; ctx.lineWidth = 1
        ctx.strokeRect(fx + 0.5, fy + 0.5, frameW - 1, frameH - 1)
        ctx.fillStyle = '#ffffff'; ctx.fillRect(fx + border, fy + border, frameW - border * 2, frameH - border * 2)
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.04)'; ctx.lineWidth = 0.5
        ctx.strokeRect(fx + border, fy + border, frameW - border * 2, frameH - border * 2)
      }

      if (!text) { frames.push(frame); return }

      // 줄바꿈으로 줄을 나누고, 글자별로 소속 줄/줄 내 위치/줄 길이를 기록한다 (\n 자체는 글자가 아님).
      const lines = text.split("\n")
      const lineCount = lines.length
      const letterMeta = []
      lines.forEach((line, lineIdx) =>
      {
        const chars = line.split("")
        chars.forEach((ch, col) => letterMeta.push({ line: lineIdx, col, lineLen: chars.length }))
      })
      const innerX = fx + border, innerY = fy + border
      const innerW = frameW - border * 2, innerH = frameH - border * 2
      const layout = letterLayoutCache[text] || (letterLayoutCache[text] = createLetterLayout(text))

      layout.forEach(l =>
      {
        const baseX = fx + l.dx, baseY = fy + l.dy
        let targetX = baseX, targetY = baseY
        let targetFontSize = l.fontSize
        if (isInteractive)
        {
          // 줄 안에서 글자를 가로 균등 배치, 줄은 세로 균등 배치
          const m = letterMeta[l.index]
          const cellW = innerW / (m.lineLen + 1), cellH = innerH / (lineCount + 1)
          targetX = innerX + cellW * (m.col + 1)
          targetY = innerY + cellH * (m.line + 1)
          // SNATCH처럼 한 줄인 이름도 큰 글자가 이웃 글자를 덮지 않도록 실제 글꼴 폭으로 제한한다.
          ctx.save()
          ctx.font = `bold ${l.fontSize}px ${l.font}`
          const metrics = ctx.measureText(l.char)
          const width = Math.max(metrics.width, (metrics.actualBoundingBoxLeft || 0) + (metrics.actualBoundingBoxRight || 0))
          const height = (metrics.actualBoundingBoxAscent || 0) + (metrics.actualBoundingBoxDescent || 0) || l.fontSize
          targetFontSize = Math.max(1, Math.floor(l.fontSize * Math.min(1, cellW * 0.8 / width, cellH * 0.7 / height)))
          ctx.restore()
        }
        frame.letters.push({ char: l.char, baseX, baseY, baseAngle: l.baseAngle, targetX, targetY, targetAngle: 0, currX: baseX, currY: baseY, currAngle: l.baseAngle, fontSize: l.fontSize, targetFontSize, currFontSize: l.fontSize, font: l.font, index: l.index })
      })
      const descriptionLayout = descriptionLayoutCache[text] || (descriptionLayoutCache[text] = createDescriptionLayout(frame))
      frame.descriptions = descriptionLayout.map(letter => ({
        ...letter,
        baseX: fx + letter.baseX, baseY: fy + letter.baseY,
        targetX: fx + letter.targetX, targetY: fy + letter.targetY,
        currX: fx + letter.baseX, currY: fy + letter.baseY,
        currAngle: letter.baseAngle, currFontSize: letter.fontSize
      }))
      frames.push(frame)
    }

    function registerGithubIcon(x, y, projectKey)
    {
      githubIcons.push({
        x,
        y,
        size: 24,
        radius: 16,
        projectKey,
        href: frameByText[projectKey].repo
      })
    }

    function getHoveredGithubIcon(x, y)
    {
      return githubIcons.find(icon => Math.hypot(x - icon.x, y - icon.y) <= icon.radius) || null
    }

    function drawGithubIcon(icon, isHovered)
    {
      ctx.save()
      ctx.translate(icon.x - icon.size / 2, icon.y - icon.size / 2)
      ctx.scale(icon.size / 16, icon.size / 16)
      ctx.fillStyle = isHovered ? '#000000' : '#555555'
      ctx.fill(GITHUB_ICON_PATH)
      ctx.restore()
    }

    // 공사중 표시용 바리케이드 아이콘. github 아이콘과 같은 색/자리에 그리되 상호작용은 없다.
    function drawWipIcon(x, y)
    {
      const w = 28, h = 16
      ctx.save()
      ctx.translate(x - w / 2, y - h / 2)
      ctx.strokeStyle = '#555555'; ctx.lineWidth = 1.5
      ctx.beginPath()
      ctx.moveTo(4.5, 8); ctx.lineTo(4.5, h)
      ctx.moveTo(w - 4.5, 8); ctx.lineTo(w - 4.5, h)
      ctx.stroke()
      ctx.beginPath(); ctx.rect(0.75, 0.75, w - 1.5, 8); ctx.stroke()
      ctx.save()
      ctx.beginPath(); ctx.rect(0.75, 0.75, w - 1.5, 8); ctx.clip()
      ctx.beginPath()
      for (let i = -8; i < w; i += 6) { ctx.moveTo(i, 9); ctx.lineTo(i + 8, 0) }
      ctx.stroke()
      ctx.restore()
      ctx.restore()
    }

    // 글자가 모두 제자리에 오면 루프를 멈춘다. 캔버스가 커서(모바일 1열 기준 약 420x5938)
    // 가만히 있는 동안에도 매 프레임 전체를 지우고 다시 그리면 iOS 사파리에서 액자가
    // 깜빡인다. 입력(마우스 이동/이탈/클릭)이나 재레이아웃이 들어오면 다시 돌린다.
    function ensureAnimating()
    {
      if (isAnimating || !canvasSize) return
      isAnimating = true
      animationFrameId = requestAnimationFrame(() => animate(canvasSize.w, canvasSize.h))
    }

    // 글자를 목표 위치로 부드럽게 당긴다. 충분히 가까워지면 목표에 정확히 붙이고 false를
    // 돌려준다(= 더 움직일 것이 없음). 이 값이 루프를 멈출 시점을 정한다.
    function ease(l, tx, ty, ta, fontSize)
    {
      let diff = ta - l.currAngle
      while (diff > Math.PI) diff -= Math.PI * 2; while (diff < -Math.PI) diff += Math.PI * 2
      if (Math.abs(tx - l.currX) < 0.05 && Math.abs(ty - l.currY) < 0.05 && Math.abs(diff) < 0.002 && Math.abs(fontSize - l.currFontSize) < 0.05)
      {
        l.currX = tx; l.currY = ty; l.currAngle = ta; l.currFontSize = fontSize
        return false
      }
      l.currX += (tx - l.currX) * 0.12; l.currY += (ty - l.currY) * 0.12
      l.currAngle += diff * 0.12
      l.currFontSize += (fontSize - l.currFontSize) * 0.12
      return true
    }

    function animate(canvasW, canvasH)
    {
      const frameW = 300, frameH = 400
      const now = Date.now()
      ctx.clearRect(0, 0, canvasW, canvasH)
      let cursorToSet = 'default'
      let stillAnimating = false
      const hoveredGithubIcon = getHoveredGithubIcon(mouse.x, mouse.y)

      frames.forEach((frame, idx) =>
      {
        frame.drawStatic()
        const isHovered = supportsHover
          ? mouse.x >= frame.fx && mouse.x <= frame.fx + frameW && mouse.y >= frame.fy && mouse.y <= frame.fy + frameH
          : visibleFrameTexts.has(frame.text)
        frame.isHovered = isHovered
        const frameData = frameByText[frame.text]
        if (isHovered && frameData && frameData.link) { cursorToSet = 'pointer' }

        if (isHovered !== frame.wasHovered) frame.transitionStartTime = now
        if (isHovered && !frame.wasHovered)
        {
          frame.mode = supportsHover ? (frame.mode + 1) % 2 : 0
          frame.hoverStartTime = now
          if (typeof gtag === 'function')
          {
            gtag('event', 'frame_hover', { frame: frameLabel(frame.text), interaction: supportsHover ? 'mouseover' : 'scroll' })
          }
        }
        // 마우스아웃 시에는 재배치하지 않는다. 글자는 원래 자리(baseX/baseY)로 되돌아간다.
        frame.wasHovered = isHovered
        if (drawFrameDescriptions(frame, isHovered, now)) stillAnimating = true

        frame.letters.forEach(l =>
        {
          let alpha = 1
          const staggerDelay = 100, elapsed = now - frame.hoverStartTime
          if (isHovered)
          {
            if (frame.mode === 0)
            {
              if (ease(l, l.targetX, l.targetY, l.targetAngle, l.targetFontSize)) stillAnimating = true
            } else
            {
              const targetTime = l.index * staggerDelay
              if (elapsed > targetTime)
              {
                l.currX = l.targetX; l.currY = l.targetY; l.currAngle = l.targetAngle; l.currFontSize = l.targetFontSize
                alpha = Math.min(1, (elapsed - targetTime) / 200)
                if (alpha < 1) stillAnimating = true
              } else
              {
                l.currX = l.baseX; l.currY = l.baseY; l.currAngle = l.baseAngle; l.currFontSize = l.fontSize
                stillAnimating = true
              }
            }
          } else
          {
            if (ease(l, l.baseX, l.baseY, l.baseAngle, l.fontSize)) stillAnimating = true
          }
          if (alpha > 0)
          {
            ctx.save()
            ctx.globalAlpha = alpha
            ctx.font = `bold ${l.currFontSize}px ${l.font}`
            ctx.fillStyle = '#000000'
            ctx.textBaseline = 'middle'; ctx.textAlign = 'center'
            ctx.translate(l.currX, l.currY); ctx.rotate(Math.round(l.currAngle / quarterTurn) * quarterTurn)
            ctx.fillText(l.char, 0, 0)
            ctx.restore()
          }
        })
      })
      githubIcons.forEach(icon => drawGithubIcon(icon, hoveredGithubIcon === icon))
      wipIcons.forEach(icon => drawWipIcon(icon.x, icon.y))
      if (hoveredGithubIcon)
      {
        cursorToSet = 'pointer'
      }
      canvas.style.cursor = cursorToSet
      isAnimating = false
      animationFrameId = null
      if (stillAnimating) ensureAnimating()
    }

    // --- Event Listeners ---
    canvas.addEventListener('mousemove', (e) =>
    {
      if (!supportsHover || !canvasSize) return
      const rect = canvas.getBoundingClientRect()
      mouse.x = (e.clientX - rect.left) * (canvasSize.w / rect.width)
      mouse.y = (e.clientY - rect.top) * (canvasSize.h / rect.height)
      ensureAnimating()
    })
    canvas.addEventListener('mouseleave', () => { if (supportsHover) { mouse.x = -1000; mouse.y = -1000; ensureAnimating() } })
    canvas.addEventListener('click', (e) =>
    {
      if (!canvasSize) return
      const rect = canvas.getBoundingClientRect()
      const clickX = (e.clientX - rect.left) * (canvasSize.w / rect.width)
      const clickY = (e.clientY - rect.top) * (canvasSize.h / rect.height)
      const clickedGithubIcon = getHoveredGithubIcon(clickX, clickY)

      if (clickedGithubIcon)
      {
        if (typeof gtag === 'function')
        {
          gtag('event', 'link_click', {
            link_type: 'github',
            frame: frameLabel(clickedGithubIcon.projectKey),
            link_url: clickedGithubIcon.href
          })
        }
        window.open(clickedGithubIcon.href, "_blank")
        return
      }

      const frameW = 300, frameH = 400
      const clickedFrame = frames.find(frame =>
        clickX >= frame.fx && clickX <= frame.fx + frameW && clickY >= frame.fy && clickY <= frame.fy + frameH)

      const clickedFrameLink = clickedFrame && frameByText[clickedFrame.text]?.link
      if (clickedFrameLink)
      {
        if (typeof gtag === 'function')
        {
          gtag('event', 'link_click', {
            link_type: 'project',
            frame: frameLabel(clickedFrame.text),
            link_url: clickedFrameLink
          })
        }
        window.open(clickedFrameLink, "_blank")
      }
      // 이동할 링크가 없는 액자(준비중/저장소만 있는 항목)도 관심도 집계를 위해 기록한다.
      else if (clickedFrame && typeof gtag === 'function')
      {
        gtag('event', 'frame_click', {
          frame: frameLabel(clickedFrame.text),
          link_type: frameByText[clickedFrame.text]?.wip ? 'wip' : 'none'
        })
      }
    })

    // --- Initial Load and Resize ---
    window.addEventListener('scroll', queueVisibilityUpdate, { passive: true })
    window.visualViewport?.addEventListener('scroll', queueVisibilityUpdate, { passive: true })
    window.visualViewport?.addEventListener('resize', queueVisibilityUpdate, { passive: true })
    window.addEventListener('resize', setupAndDraw)
    // 모바일 첫 로드 시 viewport(width=device-width) 적용 전 innerWidth가 데스크톱 기본값으로
    // 잡혀 4열로 그려지는 문제 방지: 레이아웃이 확정된 다음 프레임/로드 완료 후 그린다.
    requestAnimationFrame(setupAndDraw)
    window.addEventListener('load', setupAndDraw);
    // 웹 명조체가 준비되면 해당 글꼴의 실제 폭으로 설명만 다시 배치한다.
    if (document.fonts)
    {
      const descriptionText = framesData.flatMap(frame => frame.description || []).join('')
      document.fonts.load('26px "Noto Serif KR"', descriptionText).then(() =>
      {
        Object.keys(descriptionLayoutCache).forEach(key => delete descriptionLayoutCache[key])
        setupAndDraw()
      }).catch(() => {})
    }
    // 유휴 상태에서는 다시 그리지 않으므로, 탭 복귀/bfcache 복원처럼 캔버스 내용이
    // 날아갈 수 있는 시점에는 한 프레임 다시 그려 둔다.
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { queueVisibilityUpdate(); ensureAnimating() } })
    window.addEventListener('pageshow', () => { queueVisibilityUpdate(); ensureAnimating() })
    // 타이밍에 의존하지 않도록 실제 레이아웃 폭이 확정/변경될 때마다 다시 그린다.
    // (첫 로드 시 innerWidth가 잘못 읽혀 가로로 넘치는 문제 해결, 수동 resize 불필요)
    if (window.ResizeObserver) {
      let lastW = -1
      const ro = new ResizeObserver(() => {
        const w = document.documentElement.clientWidth
        if (w === lastW) return
        lastW = w
        requestAnimationFrame(setupAndDraw)
      })
      ro.observe(document.documentElement)
    }
  </script>
